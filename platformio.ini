; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi.git#feature/proton-picosdk-support
board = proton
framework = picosdk
debug_tool = picoprobe
build_src_flags = -O0
upload_protocol = picoprobe
monitor_speed = 115200
#lib_deps = https://github.com/raspberrypi/FreeRTOS-Kernel-Minimal.git
#lib_ldf_mode = chain+
#src_filter =
    #+<*> -<lib/FreeRTOS-Kernel-Minimal/portable/*> +<lib/FreeRTOS-Kernel-Minimal/portable/GCC/ARM_CM33/non_secure/*>
build_flags = 
	-Iinclude/
# 	-Ilib/FreeRTOS-Kernel-Minimal/include
# 	-I.pio/libdeps/proton/FreeRTOS-Kernel-Minimal/portable/GCC/ARM_CM33/non_secure/portmacro.h
    -Ilib/FreeRTOS-Kernel-Minimal/include/
    -Ilib/FreeRTOS-Kernel-Minimal/portable/GCC/ARM_CM33_NTZ/non_secure/
    -Ilib/FreeRTOS-Kernel-Minimal/portable/GCC/ARM_CM33/secure/
    -Ilib/FreeRTOS-Kernel-Minimal/portable/MemMang/non_secure/
    -Ilib/FreeRTOS-Kernel-Minimal/portable/MemMang/secure/
    -Ilib/FreeRTOS-Kernel-Minimal/portable/ARMv8M/secure/heap/
    -Ilib/FreeRTOS-Kernel-Minimal/portable/ARMv8M/secure/macros/
    -Ilib/FreeRTOS-Kernel-Minimal/

#     #-mthumb
    -mcpu=cortex-m33
    -mfpu=fpv5-sp-d16
    -mfloat-abi=softfp
    -mthumb